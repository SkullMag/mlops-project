apiVersion: batch/v1
kind: Job
metadata:
  name: production-load-test
  namespace: immich-production
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: load-test
    spec:
      restartPolicy: Never
      containers:
        - name: load-test
          image: python:3.12-slim
          env:
            - name: TARGET_URL
              value: "http://immich-tagger.immich-production.svc.cluster.local:8080/predict"
            - name: NUM_REQUESTS
              value: "500"
            - name: CONCURRENCY
              value: "50"
          command:
            - bash
            - -c
            - |
              pip install --quiet requests &&
              python3 -c "
              import os, time, requests, concurrent.futures

              URL = os.environ['TARGET_URL']
              NUM_REQUESTS = int(os.environ['NUM_REQUESTS'])
              CONCURRENCY = int(os.environ['CONCURRENCY'])
              PAYLOAD = {'request_id': 'req_0001', 'image_uri': 's3://immich-uploads/img_123.jpg'}
              HEADERS = {'Content-Type': 'application/json'}

              def send_request():
                  start = time.time()
                  try:
                      response = requests.post(URL, json=PAYLOAD, headers=HEADERS, timeout=5)
                      is_success = response.status_code == 200
                  except Exception:
                      is_success = False
                  return (time.time() - start) * 1000, is_success

              print(f'Starting load test: {NUM_REQUESTS} requests at concurrency {CONCURRENCY}...')
              print(f'Target: {URL}')
              start_time = time.time()
              latencies, errors = [], 0

              with concurrent.futures.ThreadPoolExecutor(max_workers=CONCURRENCY) as executor:
                  futures = [executor.submit(send_request) for _ in range(NUM_REQUESTS)]
                  for f in concurrent.futures.as_completed(futures):
                      lat, ok = f.result()
                      latencies.append(lat)
                      if not ok:
                          errors += 1

              total_time = time.time() - start_time
              latencies.sort()
              p50 = latencies[len(latencies) // 2]
              p95 = latencies[int(len(latencies) * 0.95)]

              print()
              print('=' * 40)
              print('LOAD TEST RESULTS')
              print('=' * 40)
              print(f'p50 Latency:   {p50:.2f} ms')
              print(f'p95 Latency:   {p95:.2f} ms')
              print(f'Throughput:    {NUM_REQUESTS / total_time:.2f} req/s')
              print(f'Error Rate:    {errors / NUM_REQUESTS * 100:.2f} %')
              print(f'Concurrency:   {CONCURRENCY}')
              print(f'Total Time:    {total_time:.2f} s')
              print('=' * 40)
              "
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
