apiVersion: batch/v1
kind: Job
metadata:
  name: production-load-test
  namespace: immich-production
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: load-test
    spec:
      restartPolicy: Never
      containers:
        - name: load-test
          image: python:3.12-slim
          env:
            - name: TARGET_URL
              value: "http://immich-tagger.immich-production.svc.cluster.local:8080/predict/legacy"
            - name: DURATION_SECONDS
              value: "300"
            - name: CONCURRENCY
              value: "1"
          command:
            - bash
            - -c
            - |
              pip install --quiet requests &&
              python3 -c "
              import os, time, threading, requests

              URL = os.environ['TARGET_URL']
              DURATION = int(os.environ['DURATION_SECONDS'])
              CONCURRENCY = int(os.environ['CONCURRENCY'])
              PAYLOAD = {'request_id': 'req_0001', 'image_uri': 's3://immich-uploads/img_123.jpg'}
              HEADERS = {'Content-Type': 'application/json'}

              latencies = []
              errors = 0
              lock = threading.Lock()
              stop = threading.Event()

              def worker():
                  global errors
                  while not stop.is_set():
                      start = time.time()
                      try:
                          r = requests.post(URL, json=PAYLOAD, headers=HEADERS, timeout=30)
                          ok = r.status_code == 200
                      except Exception:
                          ok = False
                      lat = (time.time() - start) * 1000
                      with lock:
                          latencies.append(lat)
                          if not ok:
                              errors += 1
                      time.sleep(2)

              print(f'Sustained load test: {CONCURRENCY} workers for {DURATION}s')
              print(f'Target: {URL}')
              threads = [threading.Thread(target=worker, daemon=True) for _ in range(CONCURRENCY)]
              for t in threads:
                  t.start()

              start_time = time.time()
              while time.time() - start_time < DURATION:
                  elapsed = int(time.time() - start_time)
                  print(f'  [{elapsed}/{DURATION}s] requests={len(latencies)} errors={errors}', flush=True)
                  time.sleep(30)

              stop.set()
              for t in threads:
                  t.join(timeout=10)

              total = len(latencies)
              if total == 0:
                  print('No requests completed'); exit(1)
              latencies.sort()

              print()
              print('=' * 40)
              print('LOAD TEST RESULTS')
              print('=' * 40)
              print(f'Total Requests: {total}')
              print(f'p50 Latency:    {latencies[total // 2]:.2f} ms')
              print(f'p95 Latency:    {latencies[int(total * 0.95)]:.2f} ms')
              print(f'Throughput:     {total / DURATION:.2f} req/s')
              print(f'Error Rate:     {errors / total * 100:.2f} %')
              print(f'Concurrency:    {CONCURRENCY}')
              print(f'Duration:       {DURATION} s')
              print('=' * 40)
              "
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
