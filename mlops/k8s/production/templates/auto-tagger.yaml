apiVersion: v1
kind: Secret
metadata:
  name: immich-api-key
  namespace: immich-production
type: Opaque
stringData:
  api-key: {{ .Values.immichApiKey | default "CHANGEME" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-tagger
  namespace: immich-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auto-tagger
  template:
    metadata:
      labels:
        app: auto-tagger
    spec:
      containers:
        - name: auto-tagger
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command: ["python3", "-m", "app.auto_tagger"]
          env:
            - name: IMMICH_URL
              value: "http://immich-server.immich.svc.cluster.local:2283"
            - name: TAGGER_URL
              value: "http://immich-tagger.immich-production.svc.cluster.local:8080"
            - name: IMMICH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: immich-api-key
                  key: api-key
            - name: POLL_INTERVAL
              value: "15"
            - name: MIN_SCORE
              value: "0.3"
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
