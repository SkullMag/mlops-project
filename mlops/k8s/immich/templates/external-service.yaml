apiVersion: v1
kind: Service
metadata:
  name: immich-server-external
  namespace: immich
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: immich
    app.kubernetes.io/name: server
  ports:
  - name: http
    port: 2283
    targetPort: 2283
  externalIPs:
  - {{ .Values.externalIP }}
