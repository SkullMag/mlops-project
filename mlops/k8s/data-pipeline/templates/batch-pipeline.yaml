apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch-pipeline
  namespace: data-pipeline
spec:
  schedule: "0 0 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: batch-pipeline
              image: {{ .Values.registry }}/batch-pipeline:latest
              env:
                - name: MINIO_ENDPOINT
                  value: {{ .Values.minio.endpoint }}
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: accesskey
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: secretkey
                - name: BUCKET_NAME
                  value: {{ .Values.minio.bucketName }}
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
