# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-tagger
  namespace: immich-canary

spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: immich-tagger
  template:
    metadata:
      labels:
        app: immich-tagger
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: immich-tagger
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: ENV_NAME
              value: "canary"
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.immich-platform.svc.cluster.local:8000"
            - name: MINIO_ENDPOINT
              value: "http://minio.immich-platform.svc.cluster.local:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: accesskey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secretkey
            - name: BUCKET_NAME
              value: "proj12-data"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: immich-tagger
  namespace: immich-canary
spec:
  selector:
    app: immich-tagger
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
  externalIPs:
    - {{ .Values.service.externalIP }}
---
# ReferenceGrant allows HTTPRoute in immich-platform to reference this Service
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-platform-httproute
  namespace: immich-canary
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: immich-platform
  to:
  - group: ""
    kind: Service

