---
# Pre-K8s host prep for the KVM@TACC cluster (3× CPU + 1× GPU VM).
# Each VM gets a 200GB cinder volume from terraform; the block-volume detection
# block below mounts it at /mnt/data. The detection stays defensive — if no
# extra device is found, /mnt/data is just a local directory on the root disk.

- name: Disable firewalld if present
  hosts: all
  become: yes
  tasks:
    - name: Stop and mask firewalld (ignored if not installed)
      systemd:
        name: firewalld
        state: stopped
        enabled: no
        masked: yes
      failed_when: false

- name: Ensure /mnt/data exists on every node (for containerd / local-path PVC)
  hosts: all
  become: yes
  tasks:
    - name: Create /mnt/data and subdirectories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /mnt/data
        - /mnt/data/docker
        - /mnt/data/local-path-provisioner

- name: Format and mount block storage volume (only when one is attached)
  hosts: all
  become: yes
  tasks:
    - name: Find an unpartitioned block device (cinder volume, if any)
      shell: |
        for dev in /dev/vda /dev/vdb /dev/vdc; do
          [ -b "$dev" ] || continue
          if ! lsblk -n -o TYPE "$dev" | grep -q part; then
            echo "$dev"
            exit 0
          fi
        done
        echo ""
      register: data_device
      changed_when: false

    - name: Check if data device already has a filesystem
      command: "blkid -o value -s TYPE {{ data_device.stdout }}"
      register: data_fstype
      failed_when: false
      changed_when: false
      when: data_device.stdout != ""

    - name: Format data device as ext4
      command: "mkfs.ext4 -F {{ data_device.stdout }}"
      when: data_device.stdout != "" and data_fstype.stdout == ""

    - name: Preserve existing /mnt/data contents before mounting
      shell: |
        if [ -d /mnt/data ] && [ "$(ls -A /mnt/data 2>/dev/null)" ]; then
          mkdir -p /mnt/data_backup
          cp -a /mnt/data/* /mnt/data_backup/
        fi
      when: data_device.stdout != ""

    - name: Mount data device to /mnt/data
      mount:
        path: /mnt/data
        src: "{{ data_device.stdout }}"
        fstype: ext4
        state: mounted
        opts: defaults,nofail
      when: data_device.stdout != ""

    - name: Restore preserved data onto block volume
      shell: |
        if [ -d /mnt/data_backup ] && [ "$(ls -A /mnt/data_backup 2>/dev/null)" ]; then
          cp -a /mnt/data_backup/* /mnt/data/
          rm -rf /mnt/data_backup
        fi
      when: data_device.stdout != ""

    - name: Recreate subdirectories on (possibly remounted) /mnt/data
      file:
        path: "/mnt/data/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - docker
        - local-path-provisioner
      when: data_device.stdout != ""

    # buildkit-rootless mounts this hostPath as its state dir and runs as uid 1000.
    # Without pre-creation it gets auto-made root:root, causing "permission denied"
    # on buildkitd.lock. Create it here so workflow pods can write immediately.
    - name: Ensure /mnt/data/buildkit-cache is owned by uid 1000 (buildkit-rootless)
      file:
        path: /mnt/data/buildkit-cache
        state: directory
        owner: "1000"
        group: "1000"
        mode: '0755'

- name: Set up insecure registry and Docker data-root on block volume
  hosts: all
  become: yes

  vars:
    insecure_registry: "registry.kube-system.svc.cluster.local:5000"

  tasks:
    - name: Ensure /etc/docker directory exists
      file:
        path: /etc/docker
        state: directory
        mode: '0755'

    - name: Configure Docker daemon.json (insecure registry only)
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "insecure-registries": ["{{ insecure_registry }}"]
          }
        owner: root
        group: root
        mode: '0644'

    - name: Create systemd Docker override directory
      file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        mode: '0755'

    - name: Check if docker-options.conf exists (Kubespray creates it)
      stat:
        path: /etc/systemd/system/docker.service.d/docker-options.conf
      register: docker_options_file

    - name: Update Docker data-root in systemd override if present
      replace:
        path: /etc/systemd/system/docker.service.d/docker-options.conf
        regexp: '--data-root=/var/lib/docker'
        replace: '--data-root=/mnt/data/docker'
      when: docker_options_file.stat.exists
      notify: restart docker

  handlers:
    - name: restart docker
      systemd:
        name: docker
        state: restarted
        daemon_reload: yes

- name: Configure NVIDIA container runtime on the GPU node
  hosts: gpu_nodes
  become: yes

  tasks:
    - name: Verify nvidia-smi is available (CC-Ubuntu24.04-CUDA ships drivers)
      command: nvidia-smi
      register: nvidia_smi
      changed_when: false
      failed_when: false

    - name: Warn if nvidia-smi is missing (driver install would be needed)
      debug:
        msg: "WARNING: nvidia-smi failed on this node. Image may not be CC-Ubuntu24.04-CUDA — GPU workloads will fail."
      when: nvidia_smi.rc != 0

    - name: Install nvidia-container-toolkit (idempotent if already present)
      apt:
        name: nvidia-container-toolkit
        state: present
        update_cache: yes
      failed_when: false

    - name: Configure Docker daemon.json with nvidia runtime
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "insecure-registries": ["registry.kube-system.svc.cluster.local:5000"],
            "default-runtime": "nvidia",
            "runtimes": {
              "nvidia": {
                "path": "nvidia-container-runtime",
                "runtimeArgs": []
              }
            }
          }
        owner: root
        group: root
        mode: '0644'
      notify: restart docker on gpu

  handlers:
    - name: restart docker on gpu
      systemd:
        name: docker
        state: restarted
        daemon_reload: yes
