---
- name: Disable and Mask firewalld
  hosts: all
  become: yes

  tasks:
    - name: Stop firewalld service
      systemd:
        name: firewalld
        state: stopped
        enabled: no

    - name: Mask firewalld service
      systemd:
        name: firewalld
        masked: yes

- name: Format and mount block storage volume
  hosts: node1,node2,node3
  become: yes

  tasks:
    - name: Check if /dev/vdb exists
      stat:
        path: /dev/vdb
      register: vdb_device

    - name: Check if /dev/vdb already has a filesystem
      command: blkid -o value -s TYPE /dev/vdb
      register: vdb_fstype
      failed_when: false
      changed_when: false
      when: vdb_device.stat.exists

    - name: Format /dev/vdb as ext4
      command: mkfs.ext4 -F /dev/vdb
      when: vdb_device.stat.exists and vdb_fstype.stdout == ""

    - name: Create /mnt/data mount point
      file:
        path: /mnt/data
        state: directory
        mode: '0755'
      when: vdb_device.stat.exists

    - name: Mount /dev/vdb to /mnt/data
      mount:
        path: /mnt/data
        src: /dev/vdb
        fstype: ext4
        state: mounted
        opts: defaults,nofail
      when: vdb_device.stat.exists

    - name: Create subdirectories on block volume
      file:
        path: "/mnt/data/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - docker
        - local-path-provisioner
      when: vdb_device.stat.exists

- name: Set up insecure registry and Docker data-root on block volume
  hosts: node1,node2,node3
  become: yes

  vars:
    insecure_registry: "registry.kube-system.svc.cluster.local:5000"

  tasks:
    - name: Ensure /etc/docker directory exists
      file:
        path: /etc/docker
        state: directory
        mode: '0755'

    - name: Configure Docker daemon.json with data-root on block volume
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "data-root": "/mnt/data/docker",
            "insecure-registries": ["{{ insecure_registry }}"]
          }
        owner: root
        group: root
        mode: '0644'

