---
- name: Disable and Mask firewalld
  hosts: all
  become: yes

  tasks:
    - name: Stop firewalld service
      systemd:
        name: firewalld
        state: stopped
        enabled: no

    - name: Mask firewalld service
      systemd:
        name: firewalld
        masked: yes

- name: Format and mount block storage volume
  hosts: node1,node2,node3
  become: yes

  tasks:
    - name: Find the unpartitioned block device (the 200GB attached volume)
      shell: |
        for dev in /dev/vda /dev/vdb /dev/vdc; do
          [ -b "$dev" ] || continue
          # Skip if device has partitions (it's the root disk)
          if ! lsblk -n -o TYPE "$dev" | grep -q part; then
            echo "$dev"
            exit 0
          fi
        done
        echo ""
      register: data_device
      changed_when: false

    - name: Check if data device already has a filesystem
      command: "blkid -o value -s TYPE {{ data_device.stdout }}"
      register: data_fstype
      failed_when: false
      changed_when: false
      when: data_device.stdout != ""

    - name: Format data device as ext4
      command: "mkfs.ext4 -F {{ data_device.stdout }}"
      when: data_device.stdout != "" and data_fstype.stdout == ""

    - name: Preserve existing /mnt/data contents before mounting
      shell: |
        if [ -d /mnt/data ] && [ "$(ls -A /mnt/data 2>/dev/null)" ]; then
          mkdir -p /mnt/data_backup
          cp -a /mnt/data/* /mnt/data_backup/
        fi
      when: data_device.stdout != ""

    - name: Create /mnt/data mount point
      file:
        path: /mnt/data
        state: directory
        mode: '0755'
      when: data_device.stdout != ""

    - name: Mount data device to /mnt/data
      mount:
        path: /mnt/data
        src: "{{ data_device.stdout }}"
        fstype: ext4
        state: mounted
        opts: defaults,nofail
      when: data_device.stdout != ""

    - name: Restore preserved data onto block volume
      shell: |
        if [ -d /mnt/data_backup ] && [ "$(ls -A /mnt/data_backup 2>/dev/null)" ]; then
          cp -a /mnt/data_backup/* /mnt/data/
          rm -rf /mnt/data_backup
        fi
      when: data_device.stdout != ""

    - name: Create subdirectories on block volume
      file:
        path: "/mnt/data/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - docker
        - local-path-provisioner
      when: data_device.stdout != ""

- name: Set up insecure registry and Docker data-root on block volume
  hosts: node1,node2,node3
  become: yes

  vars:
    insecure_registry: "registry.kube-system.svc.cluster.local:5000"

  tasks:
    - name: Ensure /etc/docker directory exists
      file:
        path: /etc/docker
        state: directory
        mode: '0755'

    - name: Configure Docker daemon.json (insecure registry only)
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "insecure-registries": ["{{ insecure_registry }}"]
          }
        owner: root
        group: root
        mode: '0644'

    - name: Create systemd Docker override directory
      file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        mode: '0755'

    - name: Check if docker-options.conf exists (Kubespray creates it)
      stat:
        path: /etc/systemd/system/docker.service.d/docker-options.conf
      register: docker_options_file

    - name: Update Docker data-root in systemd override if present
      replace:
        path: /etc/systemd/system/docker.service.d/docker-options.conf
        regexp: '--data-root=/var/lib/docker'
        replace: '--data-root=/mnt/data/docker'
      when: docker_options_file.stat.exists
      notify: restart docker

  handlers:
    - name: restart docker
      systemd:
        name: docker
        state: restarted
        daemon_reload: yes

