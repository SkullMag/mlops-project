[defaults]
stdout_callback = default
result_format = yaml
inventory = ./inventory.yml
host_key_checking = False
private_key_file = ~/.ssh/id_rsa_chameleon

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s \
           -o StrictHostKeyChecking=off -o UserKnownHostsFile=/dev/null \
           -o ForwardAgent=yes \
           -o ProxyCommand="ssh -i ~/.ssh/id_rsa_chameleon -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p cc@A.B.C.D"
pipelining = True
# KVM@TACC: nodes are on a private 192.168.1.x subnet; ansible jumps through
# node1's floating IP. `mlops/deploy.sh` (ensure_floating_ip) rewrites the
# `cc@A.B.C.D` placeholder above with the actual floating IP after terraform.
