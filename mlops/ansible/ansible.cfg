[defaults]
stdout_callback = default
result_format = yaml
inventory = ./inventory.yml
host_key_checking = False
private_key_file = ~/.ssh/id_rsa_chameleon

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s \
           -o StrictHostKeyChecking=off -o UserKnownHostsFile=/dev/null \
           -o ForwardAgent=yes \
           -o ProxyCommand="ssh -i ~/.ssh/id_rsa_chameleon -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p cc@129.114.27.118"
pipelining = True
# IMPORTANT: After `terraform apply`, replace A.B.C.D with the floating IP.
