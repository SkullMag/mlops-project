---
# This file is regenerated by `mlops/deploy.sh terraform` from terraform output.
# The IPs below are the static private addresses tf/kvm assigns; deploy.sh
# overwrites this file to keep it in sync if you ever change the topology.
all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
  hosts:
    node1:
      ansible_host: 192.168.1.11
      ansible_user: cc
    node2:
      ansible_host: 192.168.1.12
      ansible_user: cc
    node3:
      ansible_host: 192.168.1.13
      ansible_user: cc
    gpu-node:
      ansible_host: 192.168.1.14
      ansible_user: cc
  children:
    gpu_nodes:
      hosts:
        gpu-node:
