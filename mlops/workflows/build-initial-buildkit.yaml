apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: build-initial-container-image-
spec:
  entrypoint: buildkit-rootless-build-flow

  podMetadata:
    annotations:
      seccomp.security.alpha.kubernetes.io/pod: unconfined
      container.apparmor.security.beta.kubernetes.io/main: unconfined

  volumeClaimTemplates:
  - metadata:
      name: workdir
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi

  templates:
  - name: buildkit-rootless-build-flow
    steps:
      - - name: clone-repo
          template: git-clone
      - - name: buildkit-build
          template: buildkit-rootless
      - - name: tag-canary
          template: copy-tag
          arguments:
            parameters:
            - name: src-tag
              value: staging-1.0.0
            - name: dst-tag
              value: canary-1.0.0
        - name: tag-production
          template: copy-tag
          arguments:
            parameters:
            - name: src-tag
              value: staging-1.0.0
            - name: dst-tag
              value: production-1.0.0

  - name: git-clone
    retryStrategy:
      limit: "5"
      retryPolicy: "Always"
      backoff:
        duration: "10s"
        factor: "2"
    container:
      image: alpine/git:v2.26.2
      workingDir: /mnt/workspace
      command: [git]
      args:
        - clone
        - --depth
        - "1"
        - --branch
        - workflow-init
        - --single-branch
        - https://github.com/SkullMag/mlops-project.git
        - .
      volumeMounts:
      - name: workdir
        mountPath: /mnt/workspace

  - name: buildkit-rootless
    retryStrategy:
      limit: "3"
      retryPolicy: "Always"
      backoff:
        duration: "30s"
        factor: "2"
    # initContainer fixes the permission on the buildkit state volume
    initContainers:
    - name: init-buildkit-state
      image: busybox:1.36
      command: ['sh', '-c']
      args:
        - 'mkdir -p /home/user/.local/share/buildkit && chown -R 1000:1000 /home/user/.local/share/buildkit && chmod 700 /home/user/.local/share/buildkit'
      volumeMounts:
      - name: buildkitd
        mountPath: /home/user/.local/share/buildkit
      securityContext:
        runAsUser: 0
    container:
      image: moby/buildkit:rootless
      env:
      - name: BUILDKITD_FLAGS
        value: --oci-worker-no-process-sandbox
      command: [buildctl-daemonless.sh]
      args:
        - build
        - --frontend
        - dockerfile.v0
        - --local
        - context=/mnt/workspace
        - --local
        - dockerfile=/mnt/workspace
        - --output
        - type=image,name=registry.kube-system.svc.cluster.local:5000/immich-tagger:staging-1.0.0,push=true,registry.insecure=true
        - --export-cache
        - type=inline
        - --import-cache
        - type=registry,ref=registry.kube-system.svc.cluster.local:5000/immich-tagger:buildcache,registry.insecure=true
      resources:
        requests:
          memory: "2Gi"
          cpu: "500m"
        limits:
          memory: "3Gi"
          cpu: "1"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
      volumeMounts:
      - name: workdir
        mountPath: /mnt/workspace
      - name: buildkitd
        mountPath: /home/user/.local/share/buildkit
    # CHANGED: emptyDir instead of hostPath — fresh per pod, no permission issues
    volumes:
    - name: buildkitd
      emptyDir: {}

  - name: copy-tag
    inputs:
      parameters:
      - name: src-tag
      - name: dst-tag
    container:
      image: gcr.io/go-containerregistry/crane:debug
      command: [crane]
      args:
        - copy
        - --insecure
        - registry.kube-system.svc.cluster.local:5000/immich-tagger:{{inputs.parameters.src-tag}}
        - registry.kube-system.svc.cluster.local:5000/immich-tagger:{{inputs.parameters.dst-tag}}
